# fly.toml app configuration file generated for ecommerce-proxy on 2026-08-18T08:41:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ecommerce-proxy'
primary_region = 'ams'

[build]
  args = { GO_VERSION = '1.23.3' }

[env]
  PORT = '8080'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 256
